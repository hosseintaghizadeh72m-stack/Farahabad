<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png"><title>جزئیات اقامتگاه | farahabad.ir</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a href="index.html" class="logo"><img src="logo.png" alt="farahabad.ir">farahabad.ir</a><a href="index.html" class="muted">← بازگشت به لیست</a></header>
<div class="container" id="app"></div>
<footer>© farahabad.ir</footer>
<script src="villas-data.js"></script>
<script>
const fmt = n => n.toLocaleString("fa-IR");
const v = VILLAS.find(x=>x.id==new URLSearchParams(location.search).get("id"));
const app = document.getElementById("app");
if(!v){ app.innerHTML="<p>اقامتگاه پیدا نشد.</p>"; }
else {
  document.title = v.title + " | farahabad.ir";
  app.innerHTML = `
  <div class="detail">
    <div>
      <div class="thumb" style="background:${v.color}">${v.emoji}</div>
      <h1 style="margin-top:12px">${v.title}</h1>
      <p class="muted">${v.city} · ${v.type} · ⭐ ${fmt(v.rating)} (${fmt(v.reviews)} نظر)</p>
      <div class="box"><h3>درباره این اقامتگاه</h3><p>${v.desc}</p>
        <p class="muted">${fmt(v.rooms)} خواب · ظرفیت ${fmt(v.capacity)} نفر</p></div>
      <div class="box"><h3>امکانات</h3>${v.amenities.map(a=>`<span class="tag">${a}</span>`).join("")}</div>
      <div class="box"><h3>قوانین</h3><p class="muted">ساعت ورود ۱۴ و خروج ۱۲. حفظ آرامش همسایگان الزامی است.</p></div>
    </div>
    <aside class="box booking">
      <h3>درخواست رزرو</h3>
      <div class="price">${fmt(v.price)} تومان / شب</div>
      <div class="row"><label class="muted">تاریخ ورود</label><input type="date" id="in"></div>
      <div class="row"><label class="muted">تاریخ خروج</label><input type="date" id="out"></div>
      <div class="row"><label class="muted">تعداد نفرات</label><input type="number" id="g" min="1" max="${v.capacity}" value="2"></div>
      <div class="row"><label class="muted">نام و نام خانوادگی</label><input id="name"></div>
      <div class="row"><label class="muted">شماره موبایل</label><input id="phone" type="tel"></div>
      <div class="total" id="total"></div>
      <button style="width:100%" onclick="send()">ارسال درخواست</button>
    </aside>
  </div>`;
  ["in","out"].forEach(i=>document.getElementById(i).addEventListener("change",calc));
}
function nights(){
  const a=new Date(document.getElementById("in").value), b=new Date(document.getElementById("out").value);
  return Math.round((b-a)/86400000);
}
function calc(){
  const n=nights();
  document.getElementById("total").textContent = n>0 ? `${fmt(n)} شب × ${fmt(v.price)} = ${fmt(n*v.price)} تومان` : "";
}
function send(){
  const n=nights(), name=document.getElementById("name").value, phone=document.getElementById("phone").value;
  if(!(n>0)||!name||!phone){ alert("لطفا تاریخ‌ها، نام و شماره موبایل را درست وارد کنید."); return; }
  alert("درخواست شما ثبت شد (نمایشی). در مرحله بعد به سرور وصل می‌شود.");
}
</script>
</body>
</html>
