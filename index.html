<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.png"><title>فرح‌آباد | اجاره ویلا در فرح‌آباد و ساری</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a href="index.html" class="logo"><img src="logo.png" alt="farahabad.ir">farahabad.ir</a><span class="muted">اجاره ویلا در شمال</span></header>

<section class="hero">
  <h1>اجاره ویلا در فرح‌آباد و اطراف ساری</h1>
  <p>ویلا، سوئیت و کلبه با بهترین قیمت</p>
  <div class="search">
    <div><label>شهر</label>
      <select id="city"><option value="">همه</option><option>فرح‌آباد</option><option>ساری</option></select></div>
    <div><label>تعداد نفرات</label><input type="number" id="guests" min="1" placeholder="مثلا 6"></div>
    <div style="align-self:end"><button onclick="render()" style="width:100%">جستجو</button></div>
  </div>
</section>

<div class="container layout">
  <aside class="filters">
    <h3>فیلتر</h3>
    <div class="row"><label class="muted">نوع اقامتگاه</label>
      <select id="type"><option value="">همه</option><option>ویلا</option><option>سوئیت</option><option>کلبه</option></select></div>
    <div class="row"><label class="muted">حداکثر قیمت هر شب (تومان)</label>
      <input type="number" id="maxPrice" placeholder="مثلا 5000000"></div>
    <div class="row"><label class="chk"><input type="checkbox" id="pool"> استخر دارد</label></div>
    <div class="row"><label class="muted">مرتب‌سازی</label>
      <select id="sort"><option value="">پیش‌فرض</option><option value="cheap">ارزان‌ترین</option><option value="exp">گران‌ترین</option><option value="rate">بیشترین امتیاز</option></select></div>
    <button onclick="render()" style="width:100%">اعمال فیلتر</button>
  </aside>
  <main>
    <p class="muted" id="count" style="margin-bottom:10px"></p>
    <div class="grid" id="list"></div>
  </main>
</div>

<footer>© farahabad.ir - همه حقوق محفوظ است</footer>

<script src="villas-data.js"></script>
<script>
const fmt = n => n.toLocaleString("fa-IR");
function render(){
  const city=document.getElementById("city").value, type=document.getElementById("type").value;
  const guests=+document.getElementById("guests").value||0, max=+document.getElementById("maxPrice").value||0;
  const pool=document.getElementById("pool").checked, sort=document.getElementById("sort").value;
  let r=VILLAS.filter(v=>(!city||v.city===city)&&(!type||v.type===type)&&v.capacity>=guests&&(!max||v.price<=max)&&(!pool||v.amenities.includes("استخر")));
  if(sort==="cheap")r.sort((a,b)=>a.price-b.price);
  if(sort==="exp")r.sort((a,b)=>b.price-a.price);
  if(sort==="rate")r.sort((a,b)=>b.rating-a.rating);
  document.getElementById("count").textContent=fmt(r.length)+" اقامتگاه یافت شد";
  document.getElementById("list").innerHTML=r.map(v=>`
    <a class="card" href="villa.html?id=${v.id}">
      <div class="thumb" style="background:${v.color}">${v.emoji}</div>
      <div class="info"><h3>${v.title}</h3>
        <div class="muted">${v.city} · ${fmt(v.rooms)} خواب · تا ${fmt(v.capacity)} نفر</div>
        <div class="muted">⭐ ${fmt(v.rating)} (${fmt(v.reviews)} نظر)</div>
        <div class="price">${fmt(v.price)} تومان / شب</div></div>
    </a>`).join("")||"<p>موردی یافت نشد.</p>";
}
render();
</script>
</body>
</html>
